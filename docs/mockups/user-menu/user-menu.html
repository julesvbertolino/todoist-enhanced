<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Menu du compte, logo Todoist</title>
<style>
:root{--surface:#fff;--bg:#f6f5f4;--hover:#f0efee;--border:#ececec;--text:#202020;--muted:#666;--faint:#6b6b6b;--accent:#d1453b;--danger:#d1453b;--sh:0 8px 30px #0000001f;
 --mark:#b9b9b9;--r:22%;--sz:14px}
:root[data-theme=dark]{--surface:#1e1e1e;--bg:#141414;--hover:#2d2d2d;--border:#393939;--text:#e6e6e6;--muted:#ababab;--faint:#8c8c8c;--sh:0 8px 30px #0008}
*{box-sizing:border-box}body{margin:0;font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);display:grid;grid-template-columns:1fr 320px;min-height:100vh}
.stage{display:grid;place-items:center;padding:32px}
.side{width:260px;background:var(--surface);border-radius:14px;padding:14px 10px 18px;position:relative;box-shadow:var(--sh);min-height:420px}
.top{display:flex;align-items:center;gap:4px}
.profile{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:4px 6px 4px 4px;border-radius:10px;background:var(--hover)}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(145deg,#2d5961,#d87c62);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.identity{min-width:0}.idname{display:flex;align-items:center;gap:4px}.idname strong{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.idname svg{flex:none;color:var(--muted)}
.rank{display:block;font-size:11px;color:var(--muted);margin-top:3px}.bar{display:block;width:44px;height:3px;border-radius:3px;background:var(--border);margin-top:4px}.bar i{display:block;width:40%;height:100%;border-radius:3px;background:var(--accent)}
.ib{width:30px;height:30px;display:grid;place-items:center;color:var(--muted);border-radius:8px}
.menu{margin-top:8px;padding:6px;border:1px solid var(--border);border-radius:14px;background:var(--surface);box-shadow:var(--sh)}
.menu div{display:flex;align-items:center;gap:10px;min-height:36px;padding:6px 8px;border-radius:8px}
.menu div:hover{background:var(--hover)}.menu svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;color:var(--muted)}
.menu hr{height:1px;border:0;background:var(--border);margin:6px 0}.danger{color:var(--danger)}.danger svg.i{color:var(--danger)}
.mark{width:var(--sz);height:var(--sz);flex:none;fill:currentColor;color:var(--mark);border-radius:var(--r);display:block;margin:0 1px}
aside{background:var(--surface);padding:22px;border-left:1px solid var(--border);display:grid;gap:20px;align-content:start}
h2{margin:0;font-size:15px}h3{margin:0 0 8px;font-size:12px;color:var(--muted);font-weight:600}
.seg{display:flex;flex-wrap:wrap;gap:6px}.seg button{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
.seg button[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.sw{width:30px;height:30px;border-radius:50%!important;padding:0!important;border:1px solid var(--border)!important}
.row{display:flex;align-items:center;gap:12px}.big{display:flex;gap:18px;align-items:center;padding:14px;border:1px solid var(--border);border-radius:12px}
.big .mark{width:56px;height:56px}code{display:block;background:var(--hover);padding:10px;border-radius:8px;font-size:12px;white-space:pre-wrap}
@media(max-width:800px){body{grid-template-columns:1fr}}
</style></head><body>
<div class="stage"><div class="side">

  <span class="ib"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg></span>
  <span class="ib"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 3v18"/></svg></span></div>
 <div class="menu">
  <div><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Réglages</div>
  <div><svg class="i" viewBox="0 0 24 24"><path d="m12 3 1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></svg>Nouveautés</div>
  <div><svg class="i" viewBox="0 0 24 24"><path d="M8 8a4 4 0 0 1 8 0v1H8zM6 13H3m18 0h-3M7 20l2-3m8 3-2-3M12 22V10m-6 3v1a6 6 0 0 0 12 0v-1"/></svg>Signaler un bug ou une idée</div>

  <div class="danger"><svg class="i" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4m7 14 5-5-5-5m5 5H9"/></svg>Quitter la démo</div>
 </div></div></div>
<aside>
 <h2>Logo « Ouvrir Todoist »</h2>
 <section><h3>Arrondi des coins</h3><div class="seg" id="radius"></div></section>
 <section><h3>Couleur</h3><div class="seg" id="color"></div></section>
 <section><h3>Taille</h3><div class="seg" id="size"></div></section>
 <section><h3>Thème</h3><div class="seg" id="theme"></div></section>
 <section><h3>Aperçu agrandi</h3><div class="big"><svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 0H3C1.35 0 0 1.35 0 3v3.858s3.854 2.24 4.098 2.38c.31.18.694.177 1.004 0 .26-.147 8.02-4.608 8.136-4.675.279-.161.58-.107.748-.01.164.097.606.348.84.48.232.134.221.502.013.622l-9.712 5.59c-.346.2-.69.204-1.048.002C3.478 10.907.998 9.463 0 8.882v2.02l4.098 2.38c.31.18.694.177 1.004 0 .26-.147 8.02-4.609 8.136-4.676.279-.16.58-.106.748-.008.164.096.606.347.84.48.232.133.221.5.013.62-.208.121-9.288 5.346-9.712 5.59-.346.2-.69.205-1.048.002C3.478 14.951.998 13.506 0 12.926v2.02l4.098 2.38c.31.18.694.177 1.004 0 .26-.147 8.02-4.609 8.136-4.676.279-.16.58-.106.748-.009.164.097.606.348.84.48.232.133.221.502.013.622l-9.712 5.59c-.346.199-.69.204-1.048.001C3.478 18.994.998 17.55 0 16.97V21c0 1.65 1.35 3 3 3h18c1.65 0 3-1.35 3-3V3c0-1.65-1.35-3-3-3z"/></svg><div class="muted" style="color:var(--muted)">Le même logo en grand, pour juger les coins et la teinte.</div></div></section>
 <section><h3>Votre choix, à me renvoyer</h3><code id="out"></code></section>
</aside>
<script>
const root=document.documentElement,st={r:'22%',c:'#b9b9b9',s:'14px',t:'light'};
const opts={radius:[['12,5 % (actuel)','12.5%'],['18 %','18%'],['22 % (iOS)','22%'],['28 %','28%'],['35 %','35%']],
color:[['Gris actuel','#6b6b6b','g'],['Gris clair','#b9b9b9','g'],['Rouge Todoist','#e44332','c'],['Rouge doux','#ee8b80','c'],['Rouge de l’app','#d1453b','c'],['Texte','#202020','g']],
size:[['12','12px'],['14','14px'],['16','16px'],['18','18px']],theme:[['Clair','light'],['Sombre','dark']]};
function build(id,list,key,fmt){const el=document.getElementById(id);el.innerHTML='';list.forEach(o=>{const b=document.createElement('button');b.textContent=id==='color'?'':o[0];b.setAttribute('aria-label',o[0]);b.title=o[0];
 if(id==='color'){b.className='sw';b.style.background=o[1]}b.onclick=()=>{st[key]=o[1];apply()};b.setAttribute('aria-pressed',st[key]===o[1]);el.appendChild(b)})}
function apply(){root.style.setProperty('--r',st.r);root.style.setProperty('--mark',st.c);root.style.setProperty('--sz',st.s);root.dataset.theme=st.t;
 build('radius',opts.radius,'r');build('color',opts.color,'c'.length?'c':'c');build('size',opts.size,'s');build('theme',opts.theme,'t');
 const n=(k,l)=>(opts[k].find(o=>o[1]===st[{radius:'r',color:'c',size:'s'}[k]])||[st[{radius:'r',color:'c',size:'s'}[k]]])[0];
 document.getElementById('out').textContent='Arrondi : '+n('radius')+'\nCouleur : '+n('color')+' ('+st.c+')\nTaille : '+st.s}
apply();
</script></body></html>
