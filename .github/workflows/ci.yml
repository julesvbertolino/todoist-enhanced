name: CI

# Lint, typecheck, unit tests and a build on every push and pull request. A red
# check means don't release.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # The demo journeys, in a real browser. On pull requests, and by hand from
  # the Actions tab before tagging a release.
  e2e:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      # Controlled fixtures use Vite source modules and never call real Todoist accounts.
      - name: Development release scenarios
        run: npx playwright test e2e/assignees.spec.ts e2e/next-release.spec.ts e2e/release-refinements.spec.ts e2e/composer-regressions.spec.ts e2e/release-2.5.spec.ts
        env:
          PLAYWRIGHT_DEV: '1'
          PLAYWRIGHT_PORT: '4174'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
